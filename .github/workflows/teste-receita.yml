name: Teste de acesso à Receita (temporário)
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Listar arquivos de CNPJ
        run: |
          for u in https://arquivos.receitafederal.gov.br/dados/cnpj/dados_abertos_cnpj/ https://dadosabertos.rfb.gov.br/CNPJ/dados_abertos_cnpj/ https://arquivos.receitafederal.gov.br/; do
            code=$(curl -sS -L -m 60 -o pagina.html -w "%{http_code}" "$u" 2>erro.txt) || true
            links=$(grep -oE 'href="[^"]+"' pagina.html 2>/dev/null | sed 's/href=//;s/"//g' | tail -n 15 | tr '\n' ' ')
            echo "::notice title=$u::HTTP $code $(cat erro.txt | tr '\n' ' ') | $links"
          done
          ultimo=$(grep -oE 'href="20[0-9]{2}-[0-9]{2}/"' <(curl -sL -m 60 https://arquivos.receitafederal.gov.br/dados/cnpj/dados_abertos_cnpj/) | tail -1 | sed 's/href=//;s/"//g')
          base=https://arquivos.receitafederal.gov.br/dados/cnpj/dados_abertos_cnpj/$ultimo
          echo "::notice title=pasta $ultimo::$(curl -sL -m 60 $base | grep -oE 'href="[^"]+"' | sed 's/href=//;s/"//g' | tr '\n' ' ')"
          inicio=$(date +%s); curl -sL -m 120 -o est.zip "${base}Estabelecimentos0.zip"; fim=$(date +%s)
          echo "::notice title=velocidade::$(du -h est.zip | cut -f1) em $((fim-inicio))s"
