name: Teste de acesso à Receita (temporário)
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Listar e baixar um arquivo
        run: |
          T=YggdBLfdninEJX9
          curl -sS -m 120 -X PROPFIND -u "$T:" -H "Depth: 1" https://arquivos.receitafederal.gov.br/public.php/webdav/ -o raiz.xml || true
          meses=$(grep -oE '<d:href>[^<]+</d:href>' raiz.xml | sed 's/<[^>]*>//g' | tr '\n' ' ')
          echo "::notice title=meses::$(head -c 300 raiz.xml | tr '\n' ' ') || $meses"
          ultimo=$(grep -oE '[0-9]{4}-[0-9]{2}/' raiz.xml | sort -u | tail -1)
          curl -sS -m 120 -X PROPFIND -u "$T:" -H "Depth: 1" https://arquivos.receitafederal.gov.br/public.php/webdav/$ultimo -o mes.xml || true
          echo "::notice title=arquivos $ultimo::$(grep -oE '<d:href>[^<]+</d:href>|<d:getcontentlength>[0-9]+' mes.xml | sed 's/<[^>]*>//g' | tr '\n' ' ')"
          inicio=$(date +%s); curl -sS -L -m 300 -o est.zip "https://arquivos.receitafederal.gov.br/public.php/dav/files/$T/${ultimo}Estabelecimentos0.zip" || true; fim=$(date +%s)
          echo "::notice title=velocidade::$(du -h est.zip | cut -f1) em $((fim-inicio))s"
          unzip -l est.zip | head -5 | tr '\n' ' ' | sed 's/^/::notice title=zip::/'; echo
          unzip -p est.zip | head -3 | iconv -f latin1 -t utf-8 | tr '\n' '|' | sed 's/^/::notice title=linhas::/'; echo
