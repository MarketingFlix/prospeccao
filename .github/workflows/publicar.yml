# Gera os dados de comércios do Brasil (todo mês) e publica o app no GitHub Pages.
#
# - Todo dia 20 (a Receita publica a base do mês por volta do dia 10-15), ou manualmente em Actions >
#   "Dados e publicação" > Run workflow: baixa a base de CNPJ, gera os arquivos por cidade e bairro e
#   guarda no branch "dados-receita".
# - A cada mudança no app (pasta app/): só republica o app com os dados já gerados.
name: Dados e publicação

on:
  schedule:
    - cron: '0 6 20 * *'
  workflow_dispatch:
    inputs:
      gerar_dados:
        description: 'Baixar a base de CNPJ e gerar os dados de novo (leva 1 a 3 horas)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  gerar-dados:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.gerar_dados)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar a base de CNPJ da Receita Federal (mês mais recente)
        run: |
          # Pasta pública da Receita (Nextcloud). Se mudar, o endereço novo fica em
          # https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/cadastros/consultas/dados-publicos-cnpj
          T=YggdBLfdninEJX9
          DAV=https://arquivos.receitafederal.gov.br/public.php/webdav
          mes=$(curl -sS --fail --retry 5 -X PROPFIND -u "$T:" -H "Depth: 1" "$DAV/" | grep -oE '[0-9]{4}-[0-9]{2}/' | sort -u | tail -1)
          echo "MES_RECEITA=${mes%/}" >> "$GITHUB_ENV"
          curl -sS --fail --retry 5 -X PROPFIND -u "$T:" -H "Depth: 1" "$DAV/$mes" \
            | grep -oE '(Estabelecimentos|Empresas)[0-9]+\.zip|Municipios\.zip|Cnaes\.zip' | sort -u > arquivos.txt
          echo "::notice::Mês $mes: $(wc -l < arquivos.txt) arquivos"
          mkdir -p receita
          xargs -P 6 -I{} curl -sS --fail -L --retry 10 --retry-all-errors --retry-delay 30 \
            -o receita/{} "https://arquivos.receitafederal.gov.br/public.php/dav/files/$T/$mes{}" < arquivos.txt
          for f in receita/*.zip; do unzip -tqq "$f" > /dev/null || { echo "::error::Arquivo corrompido: $f"; exit 1; }; done
          du -sh receita

      - name: Gerar os arquivos por cidade e bairro
        run: |
          set -o pipefail
          # Em caso de erro, as últimas linhas do log viram um aviso visível na página da execução.
          python -u scripts/gerar_dados_cnpj.py receita saida --fonte "Receita Federal, CNPJ $MES_RECEITA" 2>&1 | tee log.txt || {
            echo "::error title=Falha ao gerar os dados::$(tail -n 30 log.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          }
          rm -rf receita
          echo "::notice::Tamanho dos dados: $(find saida -type f -printf '%s\n' | awk '{t+=$1} END {printf "%.0f MB", t/1e6}'), $(find saida -type f | wc -l) arquivos"

      - name: Guardar no branch "dados-receita"
        run: |
          cd saida
          git init -q
          git checkout -q -b dados-receita
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Dados da Receita ($MES_RECEITA), gerados em $(date +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados-receita

  publicar:
    needs: gerar-dados
    if: ${{ !cancelled() && needs.gerar-dados.result != 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        continue-on-error: true  # na primeira publicação o branch dos dados ainda pode não existir
        with:
          ref: dados-receita
          path: dados-branch

      - name: Montar o site (app + dados)
        run: |
          mkdir site
          cp -r app/. site/
          mkdir -p site/dados dados-branch
          rsync -a --exclude .git dados-branch/ site/dados/
          du -sh site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
